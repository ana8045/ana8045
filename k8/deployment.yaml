apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: app-EKS 
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp-container
        image: myapp:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: app-config