name: OIDC Deploy

on:
push:
branches: [ main ]

permissions:
id-token: write
contents: read

jobs:
deploy:
runs-on: self-hosted

steps:
- uses: actions/checkout@v3

- name: Configure AWS Credentials (OIDC)
  uses: aws-actions/configure-aws-credentials@v4
  with:
    role-to-assume: arn:aws:iam::962990060412:role/github-oidc-role
    aws-region: us-east-1

- name: Login to ECR
  run: |
    aws ecr get-login-password --region ap-south-1 \
    | docker login --username AWS --password-stdin \
    962990060412.dkr.ecr.us-east-1.amazonaws.com

- name: Build Image
  run: docker build -t demo-app ./app

- name: Push Image
  run: |
    docker tag demo-app:latest \
    962990060412.dkr.ecr.us-east-1.amazonaws.com/demo-app:latest
    docker push \
    962990060412.dkr.ecr.us-east-1.amazonaws.com/demo-app:latest

- name: Deploy to EKS
  run: |
    aws eks update-kubeconfig --name demo-cluster --region us-east-1
    kubectl apply -f k8s/
