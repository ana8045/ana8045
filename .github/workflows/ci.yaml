on:
  push:
    branches:
      - learning
jobs:
  terraform:  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.0
      - name: Initialize Terraform
        run: terraform init
      - name: Validate Terraform configuration
        run: terraform validate
      - name: Plan Terraform deployment
        run: terraform plan -out=tfplan
      - name: Apply Terraform deployment
        run: terraform apply -auto-approve tfplan
  kubernetes:
    runs-on: ubuntu-latest  
    needs: terraform
    steps:  
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up kubectl
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --region us-west-1 --name my-learning-eks-cluster
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl apply -f configmap.yaml
      - name: Verify deployment
        run: |    
          kubectl get deployments -n app-EKS
          kubectl get services -n app-EKS
          kubectl get configmaps -n app-EKS
          echo "Deployment successful!"
      - name: Clean up resources
        if: always()
        run: |
          kubectl delete -f deployment.yaml
          kubectl delete -f service.yaml
          kubectl delete -f configmap.yaml
      - name: Destroy Terraform resources
        if: always()
        run: terraform destroy -auto-approve
      - name: Post cleanup message
        if: always()
        run: echo "All resources have been cleaned up."
      - name: Post deployment message
        if: success()
        run: echo "Deployment and verification successful!"
      - name: Build Docker image
        if: success()
        run: |
          docker build -t myapp:latest .
      - name: Push Docker image to ECR
        if: success() 
        run: |
          aws ecr get-login-password --region us-west-1 | docker login --username AWS --password-stdin <aws_account_id>.dkr.ecr.us-west-1.amazonaws.com
          docker tag myapp:latest <aws_account_id>.dkr.ecr.us-west-1.amazonaws.com/myapp:latest
          docker push <aws_account_id>.dkr.ecr.us-west-1.amazonaws.com/myapp:latest
      - name: Update Kubernetes deployment with new image
        if: success()
        run: |
          kubectl set image deployment/app-deployment myapp-container=<aws_account_id>.dkr.ecr.us-west-1.amazonaws.com/myapp:latest -n app-EKS
      - name: Verify updated deployment
        if: success() 
        run: |
          kubectl rollout status deployment/app-deployment -n app-EKS
          echo "Deployment updated with new image successfully!"
      - name: Post image update message
        if: success() 
        run: echo "Docker image built, pushed to ECR, and deployment updated successfully!"
